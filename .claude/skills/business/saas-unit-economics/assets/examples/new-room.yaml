# New Room's cost model of 2026-11-13 (references/worked-example.md), in this skill's format. The
# calculator's tests reproduce the prices New Room published from it.

as_of: 2026-11-13

currency:
  cost: USD
  price: GEL

pricing:
  price_one_tier_ahead: true
  minimum_multiple: 2
  target_multiple: 3
  contingency: 0.15
  round_step: 10
  round_ending: -1

fx:
  rate: 2.5935                # NBG official rate, 2026-11-13
  buffer: 0.10

tax:                          # individual entrepreneur, small-business status
  turnover_tax: 0.01
  small_business_limit: 500000
  vat_rate: 0.18
  vat_threshold: 100000
  vat_registered: false
payment_fee: 0.025            # assumption

users:
  dau_per_mau: 0.20
  peak_share_of_dau: 0.15
  upgrade_at: 0.50

tiers:                        # load test of 2026-11-12; each includes Spaces $5 and DOCR $5
  - { id: T0, name: s-1vcpu-2gb, all on one box, monthly: 22.00, capacity: 60, managed_db: false, measured: true }
  - { id: T1, name: s-2vcpu-4gb, monthly: 34.00, capacity: 160, managed_db: false, measured: true }
  - { id: T2, name: s-4vcpu-8gb, monthly: 58.00, capacity: 280, managed_db: false, measured: true }
  - { id: T3, name: s-2vcpu-4gb + managed PG 1 GB, monthly: 49.15, capacity: 160, managed_db: true, measured: true }
  - { id: T4, name: s-4vcpu-8gb + managed PG 4 GB, monthly: 118.90, capacity: 280, managed_db: true, measured: false }

data_safety:
  hardening_monthly: 3.40     # weekly Droplet backups 2.40 + a 10 GiB volume 1.00
  managed_db_from_customers: 5

usage:
  - name: egress              # 4 sessions a month × 6 MB of images
    unit: GB
    per_mau: 0.024
    included: 1000
    over: { per_unit: 0.01 }
  - name: storage             # (300 first + 240 a year) products × 3 MB
    unit: GB
    per_customer: 1.62
    included: 250
    over: { per_unit: 0.02 }
  - name: email               # 0.5 a user + 0.05 orders × 2
    unit: emails
    per_mau: 0.6
    included: 9000
    over: { flat: 9 }

ai:
  per_customer:               # 20 products a month + 300 onboarding ÷ 12 = 45 a month, half from photos
    - { name: photo analysis (Sonnet, 2 photos), unit_cost: 0.036, units_per_month: 22.5 }
    - { name: description (Haiku), unit_cost: 0.00025, units_per_month: 45 }
  per_mau:
    - { name: photo analysis (Sonnet, 2 photos), unit_cost: 0.036, units_per_month: 0.1 }

fixed:
  - { name: Claude Pro, monthly: 20 }
  - { name: domain newroom.ge (₾50 a year), monthly: 4.1666666667, currency: price }

scenarios:
  customers: [1, 3, 5, 10, 20, 50, 100]
  mau_per_customer: [50, 100, 300]
